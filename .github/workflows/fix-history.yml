name: Fix history once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch popup history logic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("popup.js")
          text = path.read_text(encoding="utf-8")

          old = '''            const newUrl = url.replace(KINOPOISK_BASE, WATCH_BASE);
            chrome.tabs.update(tab.id, { url: newUrl });'''

          new = '''            const newUrl = url.replace(KINOPOISK_BASE, WATCH_BASE);

            // Сохраняем в историю до навигации: popup закрывается при смене страницы.
            const historyTitle = tab.title || "Неизвестно";
            addToHistory(historyTitle, newUrl);

            chrome.tabs.update(tab.id, { url: newUrl });'''

          if old not in text:
              raise SystemExit("Redirect block not found")

          text = text.replace(old, new, 1)

          delayed = '''                            addToHistory(title, newUrl);
                            
'''
          if delayed not in text:
              raise SystemExit("Delayed history block not found")

          text = text.replace(delayed, "", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Check JavaScript syntax
        run: node --check popup.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add popup.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix history for Watch button"
          git push origin main
