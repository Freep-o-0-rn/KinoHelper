name: Fix history once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-history.yml'

permissions:
  contents: write

jobs:
  fix-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch popup history logic
        run: echo '' | base64 -d | python3

      - name: Check JavaScript syntax
        run: node --check popup.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add popup.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix history for Watch button"
          git push origin main
