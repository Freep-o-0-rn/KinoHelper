name: Apply scoped dropdown scraper fix
on:
  push:
    paths:
      - '.github/scripts/patch-filter-scraper.py'
      - '.github/workflows/apply-filter-scraper-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-filter-scraper.py
      - name: Validate
        run: |
          node --check filters.js
          node --check background.js
          python - <<'PY'
          from pathlib import Path
          f = Path('filters.js').read_text(encoding='utf-8')
          b = Path('background.js').read_text(encoding='utf-8')
          assert "kinopoiskFilterUrlCacheV3" in f
          assert "action: 'fetchFilterPage'" in f
          assert 'async function fetchFilterPage(url)' in b
          assert 'message.action === "fetchFilterPage"' in b
          PY
      - name: Commit
        run: |
          rm -f .github/scripts/patch-filter-scraper.py
          rm -f .github/workflows/apply-filter-scraper-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix dynamic dropdown filter scraping"
          git push
