name: Cleanup filter loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-filter-loading.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply cleanup
        run: python3 .github/cleanup_filter_loading.py

      - name: Validate
        run: |
          node --check filters.js
          node --check filters-ui.js
          node --check popup.js
          node --check background.js
          python3 -m json.tool manifest.json > /dev/null
          test "$(grep -c 'function delay(ms)' filters.js)" -eq 1
          test "$(grep -c 'function readKinopoiskPageInTab' filters.js)" -eq 1
          grep -q 'readPage: readKinopoiskPageInTab' filters.js
          grep -q 'getMaxPageViaTab' filters-ui.js
          ! grep -q 'const response = await fetch(pageUrl.href)' filters-ui.js
          grep -q '"version": "1.502"' manifest.json

      - name: Commit
        run: |
          git config user.name "Vi"
          git config user.email "Pornoenot@gmail.com"
          git rm .github/workflows/cleanup-filter-loading.yml .github/cleanup_filter_loading.py
          git add filters.js filters-ui.js
          git commit -m "Use browser tabs for Kinopoisk filter and random pages"
          git push origin main
