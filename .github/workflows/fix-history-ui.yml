name: Apply history UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch history UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('popup.js')
          s = p.read_text(encoding='utf-8')
          old = 'const historyItems = document.getElementById("historyItems");\nconst clearFiltersBtn = document.getElementById("clearFiltersBtn");'
          new = 'const historyItems = document.getElementById("historyItems");\nconst historyToggle = document.getElementById("historyToggle");\nconst clearFiltersBtn = document.getElementById("clearFiltersBtn");'
          if old not in s: raise SystemExit('history const marker not found')
          s = s.replace(old, new, 1)
          old = "// Обработчики кнопок фильтров\nclearFiltersBtn.addEventListener('click', clearFilters);\n"
          new = "// Обработчики кнопок фильтров\nclearFiltersBtn.addEventListener('click', clearFilters);\n\n// Сворачивание/разворачивание истории\nfunction setHistoryCollapsed(collapsed) {\n    historyItems.classList.toggle('collapsed', collapsed);\n    historyToggle.innerHTML = collapsed ? '<span class=\\\"icon\\\">▶</span> Показать' : '<span class=\\\"icon\\\">▼</span> Скрыть';\n    historyToggle.setAttribute('aria-expanded', String(!collapsed));\n    localStorage.setItem('historyCollapsed', String(collapsed));\n}\n\nhistoryToggle.addEventListener('click', () => {\n    setHistoryCollapsed(!historyItems.classList.contains('collapsed'));\n});\n\n// Не даём tooltip и hover-анимациям расширять/дёргать блок истории.\nhistoryToggle.classList.remove('tooltip');\nhistoryToggle.removeAttribute('data-tooltip');\nconst historyStyle = document.createElement('style');\nhistoryStyle.textContent = '.history-toggle:hover,.history-item-btn:hover{transform:none;box-shadow:none}.history-item,.history-item:hover{padding:6px 8px}.history-toggle.tooltip:hover::after{display:none}';\ndocument.head.appendChild(historyStyle);\n"
          if old not in s: raise SystemExit('toggle insert marker not found')
          s = s.replace(old, new, 1)
          old = "    // Загрузка истории\n    updateHistoryView();\n    \n    // Показать текущий фильм\n"
          new = "    // Загрузка истории\n    updateHistoryView();\n    const isHistoryCollapsed = localStorage.getItem('historyCollapsed') === 'true';\n    setHistoryCollapsed(isHistoryCollapsed);\n    \n    // Показать текущий фильм\n"
          if old not in s: raise SystemExit('history init marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: node --check popup.js

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-history-ui.yml
          git add popup.js
          git commit -m "Fix history toggle and hover jitter"
          git push origin main
