name: Apply settings and history update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-settings-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Write popup files
        env:
          POPUP_HTML_GZ: ''
          POPUP_CSS_GZ: ''
          POPUP_JS_GZ: ''
        run: |
          printf '%s' "$POPUP_HTML_GZ" | base64 -d | gzip -d > popup.html
          printf '%s' "$POPUP_CSS_GZ" | base64 -d | gzip -d > popup.css
          printf '%s' "$POPUP_JS_GZ" | base64 -d | gzip -d > popup.js

      - name: Check JavaScript syntax
        run: node --check popup.js

      - name: Commit update and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-settings-update.yml
          git add popup.html popup.css popup.js
          git commit -m "Add settings screen and configurable history"
          git push origin main
