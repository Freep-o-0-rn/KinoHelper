name: Invalidate dropdown catalog cache
on:
  push:
    paths:
      - '.github/workflows/bump-filter-catalog-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump catalog key
        run: |
          sed -i "s/kinopoiskFilterCatalogV1/kinopoiskFilterCatalogV2/g" filters.js
          node --check filters.js
      - name: Commit
        run: |
          git config user.name "Vi"
          git config user.email "Pornoenot@gmail.com"
          git add filters.js
          git commit -m "Refresh dropdown filter catalog" || true
          git rm .github/workflows/bump-filter-catalog-cache.yml
          git commit -m "Remove temporary catalog cache workflow" || true
          git push
