name: Apply contextual watch button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-watch-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch popup logic
        run: |
          echo '' | base64 -d > /tmp/patch_popup.py
          python3 /tmp/patch_popup.py

      - name: Validate extension files
        run: |
          node --check popup.js
          node --check background.js
          python3 -m json.tool manifest.json > /dev/null

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-watch-button.yml
          git add popup.js
          git commit -m "Make Watch button context-aware"
          git push origin main
