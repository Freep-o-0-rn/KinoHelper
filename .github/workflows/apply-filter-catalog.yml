name: Apply dropdown filter catalog
on:
  push:
    paths:
      - '.github/scripts/patch-filter-catalog.py'
      - '.github/workflows/apply-filter-catalog.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply catalog patch
        run: python .github/scripts/patch-filter-catalog.py
      - name: Validate
        run: |
          node --check filters.js
          node --check filters-ui.js
      - name: Commit
        run: |
          git config user.name Vi
          git config user.email Pornoenot@gmail.com
          rm .github/scripts/patch-filter-catalog.py .github/workflows/apply-filter-catalog.yml
          git add -A
          git commit -m "Parse country genre and year dropdowns" || exit 0
          git push
