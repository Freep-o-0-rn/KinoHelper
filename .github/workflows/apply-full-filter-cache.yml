name: Apply per-URL full filter cache
on:
  push:
    paths:
      - '.github/workflows/apply-full-filter-cache.yml'
      - '.tmp_apply_full_filter_cache.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .tmp_apply_full_filter_cache.py
      - name: Validate
        run: |
          node --check filters.js
          grep -q "kinopoiskFilterUrlCacheV2" filters.js
          grep -q "fetchCompleteModelViaServiceWindow" filters.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .tmp_apply_full_filter_cache.py .github/workflows/apply-full-filter-cache.yml
          git add -A
          git commit -m "Cache complete filter models per URL"
          git push
