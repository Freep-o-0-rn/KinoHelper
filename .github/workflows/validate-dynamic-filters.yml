name: Validate dynamic filters

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-dynamic-filters.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check JavaScript
        run: |
          node --check filters.js
          node --check filters-ui.js
          node --check popup.js
          node --check background.js

      - name: Check integration
        run: |
          python3 -m json.tool manifest.json > /dev/null
          grep -q '"version": "1.502"' manifest.json
          grep -q 'vadim.reizer@ya.ru' popup.html
          grep -q 'Фильтры случайного выбора' popup.html
          grep -q 'filters.css' popup.html
          grep -q 'filters.js' popup.html
          grep -q 'filters-ui.js' popup.html
          grep -q 'KinoFilterEngine' filters.js
          grep -q 'stopImmediatePropagation' filters-ui.js
          grep -q 'Контекстная кнопка: Кинопоиск' popup.js

      - name: Remove validator
        run: |
          git config user.name "Vi"
          git config user.email "Pornoenot@gmail.com"
          git rm .github/workflows/validate-dynamic-filters.yml
          git commit -m "Remove dynamic filter validator"
          git push origin main
