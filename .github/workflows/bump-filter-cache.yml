name: Bump filter cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-filter-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Invalidate old cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('filters.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const CACHE_KEY = 'kinopoiskDynamicFilterCacheV2';", "const CACHE_KEY = 'kinopoiskDynamicFilterCacheV3';", 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check filters.js
      - name: Commit
        run: |
          git config user.name "Vi"
          git config user.email "Pornoenot@gmail.com"
          git rm .github/workflows/bump-filter-cache.yml
          git add filters.js
          git commit -m "Invalidate legacy Kinopoisk filter cache"
          git push origin main
