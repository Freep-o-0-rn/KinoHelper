name: Apply exact listbox scraper

on:
  push:
    paths:
      - '.github/workflows/apply-aria-listbox-scraper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/patch_aria_listbox.py
      - name: Validate JavaScript
        run: |
          node --check background.js
          node --check filters.js
      - name: Commit result and clean temporary files
        run: |
          rm -f .github/workflows/apply-aria-listbox-scraper.yml tools/patch_aria_listbox.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Parse Kinopoisk filters from exact listboxes"
          git push
