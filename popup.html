<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320, initial-scale=1">
  <title>КиноПомощник</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="filters.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-brand">
        <span class="brand-icon" aria-hidden="true">🎬</span>
        <h1>КиноПомощник</h1>
      </div>
      <button class="header-button" id="settingsButton" type="button" title="Настройки" aria-label="Открыть настройки">⚙</button>
    </header>

    <div class="screen-stage">
      <section class="screen main-screen" id="mainScreen" aria-label="Главный экран">
        <div class="screen-scroll">
          <main class="main-content">
            <button class="filters-toggle" id="filtersToggle" type="button" aria-expanded="false">
              <span>Фильтры случайного выбора</span>
              <span class="toggle-chevron">▼</span>
            </button>

            <div class="filters" id="filters">
              <!-- Compatibility placeholders for the legacy popup.js filter bindings.
                   They are hidden by filters.css and are never used by Random. -->
              <div class="filter-row" aria-hidden="true">
                <select id="genreFilter" tabindex="-1"><option value=""></option></select>
                <select id="typeFilter" tabindex="-1"><option value=""></option></select>
              </div>
              <input type="number" id="yearFilter" tabindex="-1" aria-hidden="true">
              <div class="checkbox-group" aria-hidden="true">
                <input type="checkbox" id="highRatedCheckbox" tabindex="-1">
                <input type="checkbox" id="releasedCheckbox" tabindex="-1">
                <input type="checkbox" id="popularCheckbox" tabindex="-1">
              </div>

              <div class="filter-buttons">
                <button class="btn-clear" id="clearFiltersBtn" type="button" title="Очистить фильтры">🗑️ Очистить фильтры</button>
              </div>
            </div>

            <div class="action-grid">
              <button class="btn-primary has-tooltip" id="kinopoiskFilm" type="button" data-tooltip="Перейти к фильмам на Кинопоиске"><span class="icon">🎬</span> Фильмы</button>
              <button class="btn-primary has-tooltip" id="kinopoiskSerial" type="button" data-tooltip="Перейти к сериалам на Кинопоиске"><span class="icon">📺</span> Сериалы</button>
            </div>

            <div class="main-buttons">
              <button class="btn-secondary" id="randomFilm" type="button"><span class="icon">🎲</span> Случайный</button>
              <button class="btn-convert" id="convert" type="button"><span class="icon">▶</span> Смотреть</button>
              <button class="btn-accent" id="openOnKinopoisk" type="button" style="display: none;"><span class="icon">🎭</span> На Кинопоиск</button>
            </div>

            <section class="context-card info" id="contextCard" aria-label="Текущий фильм или состояние">
              <div id="message" class="info" aria-live="polite">Выберите фильтры и нажмите «Случайный»</div>

              <section class="rating-card" id="ratingCard" aria-label="Оценка на Кинопоиске" hidden>
                <div class="rating-card-header">
                  <span class="rating-card-title">Кинопоиск: <strong class="movie-rating" id="movieRating">—</strong></span>
                  <span class="rating-current" id="ratingCurrent">Ваша: —</span>
                </div>
                <div class="rating-scale" id="ratingScale" role="group" aria-label="Поставить оценку от 1 до 10"></div>
                <div class="rating-status" id="ratingStatus" aria-live="polite"></div>
              </section>
            </section>

            <div class="history" id="history">
              <div class="history-header">
                <div class="history-title">Недавно просмотренные</div>
                <button class="history-toggle" id="historyToggle" type="button" aria-expanded="true"><span class="icon">▼</span> Скрыть</button>
              </div>
              <div class="history-items" id="historyItems"></div>
            </div>

            <div class="author-info">
              <div class="author-name">FreeP0rn</div>
              <div class="author-email">vadim.reizer@ya.ru</div>
            </div>
          </main>
        </div>
      </section>

      <section class="screen settings-screen" id="settingsScreen" aria-label="Настройки">
        <div class="screen-scroll">
          <div class="settings-content">
            <button class="back-button" id="backToMain" type="button">← Настройки</button>

            <section class="settings-section">
              <div class="settings-section-title">ИНТЕРФЕЙС</div>
              <label class="setting-field" for="themeSelect">
                <span>Тема</span>
                <select id="themeSelect">
                  <option value="system">Системная</option>
                  <option value="light">Светлая</option>
                  <option value="dark">Тёмная</option>
                  <option value="bright">Яркая</option>
                </select>
              </label>
            </section>

            <section class="settings-section">
              <div class="settings-section-title">ИСТОРИЯ</div>

              <label class="setting-field" for="historyMaxItems">
                <span>Максимум записей</span>
                <select id="historyMaxItems">
                  <option value="5">5</option>
                  <option value="10">10</option>
                  <option value="20">20</option>
                  <option value="50">50</option>
                  <option value="unlimited">Без ограничений</option>
                </select>
              </label>

              <label class="setting-field" for="historyMaxAge">
                <span>Удалять старше</span>
                <select id="historyMaxAge">
                  <option value="7">7 дней</option>
                  <option value="30">30 дней</option>
                  <option value="90">90 дней</option>
                  <option value="365">1 год</option>
                  <option value="unlimited">Без ограничений</option>
                </select>
              </label>

              <label class="setting-checkbox">
                <input type="checkbox" id="excludeHistoryFromRandom">
                <span>Не показывать просмотренные при случайном выборе</span>
              </label>
            </section>

            <section class="settings-section">
              <div class="settings-section-title">ДАННЫЕ</div>
              <button class="danger-button" id="clearHistoryBtn" type="button">Очистить историю</button>

              <div class="clear-confirm" id="clearHistoryConfirm">
                <div class="clear-confirm-text">Удалить всю историю?</div>
                <div class="clear-confirm-actions">
                  <button class="secondary-small" id="cancelClearHistory" type="button">Отмена</button>
                  <button class="danger-small" id="confirmClearHistory" type="button">Очистить</button>
                </div>
              </div>
            </section>

            <div class="settings-note">Изменения применяются автоматически.</div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="popup.js"></script>
  <script src="filters.js"></script>
  <script src="filters-ui.js"></script>
</body>
</html>
